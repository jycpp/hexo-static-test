<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网站建设中 - Under Construction</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #e0e0e0;
            overflow: hidden;
        }

        /* Animated background grid */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image:
                linear-gradient(rgba(255, 140, 0, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 140, 0, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
            pointer-events: none;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(60px, 60px); }
        }

        .container {
            text-align: center;
            padding: 3rem 2rem;
            max-width: 560px;
            position: relative;
            z-index: 1;
        }

        .icon {
            width: 100px;
            height: 100px;
            margin-bottom: 2rem;
            animation: bounce 2s ease-in-out infinite;
            filter: drop-shadow(0 8px 24px rgba(255, 140, 0, 0.3));
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 1rem;
            background: linear-gradient(90deg, #ff8c00, #ffc800);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #a0aec0;
            line-height: 1.7;
            margin-bottom: 2.5rem;
        }

        /* Progress bar */
        .progress-wrapper {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 1.2rem 1.5rem;
            margin-bottom: 2.5rem;
            border: 1px solid rgba(255, 140, 0, 0.1);
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #8892a4;
            margin-bottom: 0.6rem;
        }

        .progress-bar {
            height: 8px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 35%;
            background: linear-gradient(90deg, #ff8c00, #ffc800);
            border-radius: 4px;
            animation: progressPulse 3s ease-in-out infinite;
        }

        @keyframes progressPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* Gear animation */
        .gears {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 2rem;
        }

        .gear {
            width: 28px;
            height: 28px;
            border: 3px solid rgba(255, 140, 0, 0.4);
            border-radius: 50%;
            position: relative;
            animation: spin 4s linear infinite;
        }

        .gear::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 8px;
            background: #ff8c00;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        .gear:nth-child(2) {
            animation-direction: reverse;
            animation-duration: 3s;
        }

        .gear:nth-child(3) {
            animation-duration: 5s;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .footer {
            font-size: 0.8rem;
            color: #4a5568;
        }

        .dot {
            display: inline-block;
            animation: dotPulse 1.4s infinite;
        }

        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes dotPulse {
            0%, 80%, 100% { opacity: 0.3; }
            40% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="icon" src="static/images/construction.png" alt="建设中">

        <h1>网站正在建设中</h1>

        <p class="subtitle">
            我们正在努力打造全新的网站体验，<br>
            敬请期待即将上线的精彩内容。
        </p>

        <div class="progress-wrapper">
            <div class="progress-label">
                <span>建设进度</span>
                <span>35%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
        </div>

        <div class="gears">
            <div class="gear"></div>
            <div class="gear"></div>
            <div class="gear"></div>
        </div>

        <p class="footer">
            正在施工中<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>
        </p>
    </div>
</body>
</html>
